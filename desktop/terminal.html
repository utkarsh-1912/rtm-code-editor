<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
<title>Terminal</title>
<style>
    :root {
        --bg: #F5F7FB; --panel: #FFFFFF; --ink: #1A2233; --ink-2: #5B6880; --line: #DCE2EC;
        --accent: #2F6BFF; --err: #C2362B; --ok: #1F8A4C;
        --c0: #1A2233; --c1: #C2362B; --c2: #1F8A4C; --c3: #9A6B00; --c4: #2F6BFF; --c5: #8A3FD1; --c6: #0E7C86; --c7: #5B6880;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0B0B0A; --panel: #121211; --ink: #ECEAE4; --ink-2: #8E8B83; --line: #262522;
            --accent: #7AA2FF; --err: #FF7A6E; --ok: #5FD38D;
            --c0: #8E8B83; --c1: #FF7A6E; --c2: #5FD38D; --c3: #E8C468; --c4: #7AA2FF; --c5: #C79BFF; --c6: #5ED3DB; --c7: #ECEAE4;
        }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
    body { display: flex; flex-direction: column; font: 13px/1.5 ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-family: system-ui, sans-serif; font-size: 12px; color: var(--ink-2); }
    header b { color: var(--ink); font-weight: 600; }
    header .cwd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
    header button:hover { border-color: var(--accent); }
    header button:disabled { opacity: .45; cursor: default; }
    #screen { flex: 1; overflow-y: auto; padding: 12px 14px 4px; white-space: pre-wrap; word-break: break-word; }
    .cmd { color: var(--ink); }
    .cmd .p { color: var(--accent); }
    .stderr { color: var(--err); }
    .note { color: var(--ink-2); }
    .exit-bad { color: var(--err); font-size: 11px; }
    #line { display: flex; gap: 8px; align-items: baseline; padding: 6px 14px 12px; }
    #prompt { color: var(--accent); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
    #input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 0; outline: 0; caret-color: var(--accent); }
    .running #prompt { color: var(--ink-2); }
    ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
</style>
</head>
<body>
<header>
    <b>Terminal</b>
    <span class="cwd" id="cwd"></span>
    <span id="state"></span>
    <button id="stop" disabled title="Stop (Ctrl+C)">Stop</button>
    <button id="clear" title="Clear (Ctrl+L)">Clear</button>
</header>
<div id="screen" role="log" aria-live="polite"></div>
<div id="line">
    <span id="prompt"></span>
    <input id="input" autocomplete="off" spellcheck="false" aria-label="Command" autofocus />
</div>
<script src="terminal-ui.js"></script>
</body>
</html>
