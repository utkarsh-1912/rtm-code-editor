<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
  <title>Utkristi CoLabs</title>
  <style>
    :root { --bg: #F5F7FB; --ink: #0E1A33; --muted: #8592A9; --line: rgba(14,26,51,.12); --accent: #2F62C9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0B0B0A; --ink: #E8E6DF; --muted: #6E6C66; --line: rgba(232,230,223,.12); --accent: #9CC3FF; } }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-app-region: drag; }
    main { height: 100%; display: grid; place-items: center; }
    .core { width: min(340px, 80vw); display: grid; grid-template-columns: auto 1fr; gap: 14px 16px; align-items: center; }
    svg { width: 48px; height: 48px; overflow: visible; }
    .tile { fill: var(--ink); } .ring { stroke: var(--bg); } .halo { fill: var(--bg); } .dot { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: beat 1.8s ease-in-out infinite; }
    .ring { stroke-dasharray: 100; animation: draw 1.8s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 100; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
    @keyframes beat { 50% { transform: scale(1.3); } }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    p { margin: 2px 0 0; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .track { grid-column: 1 / -1; height: 2px; background: var(--line); overflow: hidden; position: relative; border-radius: 2px; }
    .track i { position: absolute; inset: 0 auto 0 -40%; width: 38%; background: var(--ink); border-radius: 2px; animation: slide 1.4s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes slide { to { left: 102%; } }
    .time { grid-column: 1 / -1; font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="core" role="status" aria-live="polite">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect class="tile" x="1" y="1" width="28" height="28" rx="8.5" />
        <path class="ring" d="M21.6 18.7 A7 7 0 1 1 18.7 9.4" fill="none" stroke-width="2.6" stroke-linecap="round" pathLength="100" />
        <circle class="halo" cx="24.5" cy="24.5" r="6.4" />
        <circle class="dot" cx="24.5" cy="24.5" r="4" />
      </svg>
      <div>
        <h1>Starting Utkristi CoLabs</h1>
        <p id="note">Connecting to the server</p>
      </div>
      <div class="track"><i></i></div>
      <span class="time" id="time">00:00</span>
    </div>
  </main>
  <script>
    const t0 = Date.now();
    const note = document.getElementById("note");
    const time = document.getElementById("time");
    setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      time.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      if (s > 4) note.textContent = navigator.onLine ? "Waking the server, up to a minute" : "Offline, waiting for a connection";
    }, 1000);
  </script>
</body>
</html>
