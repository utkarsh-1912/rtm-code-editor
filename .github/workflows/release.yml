name: Release

# Release flow:  npm run release -- 1.2.0   (bumps versions, commits, tags v1.2.0)
#                git push --follow-tags     (this workflow takes over)
# Tag push: verify the web app builds -> build Windows/macOS/Linux installers ->
# publish one GitHub release with checksums -> optionally redeploy the website.
# Run it manually (workflow_dispatch) to build installers without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Server syntax check
        run: |
          for f in server.js $(find server -name '*.js'); do node --check "$f"; done
      - name: Build web app
        run: npm run build
        env:
          CI: "false"
          # The same build is bundled into the desktop installers (desktop/scripts/bundle-web.js).
          # Set these as repository secrets or variables; without the Firebase ones the installers
          # skip the bundled UI and open the hosted site instead.
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY || vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN || vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID || vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET || vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID || vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID || vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_RUNNER_URL: ${{ vars.REACT_APP_RUNNER_URL }}
          REACT_APP_TURN_URL: ${{ secrets.REACT_APP_TURN_URL || vars.REACT_APP_TURN_URL }}
          REACT_APP_TURN_USERNAME: ${{ secrets.REACT_APP_TURN_USERNAME || vars.REACT_APP_TURN_USERNAME }}
          REACT_APP_TURN_CREDENTIAL: ${{ secrets.REACT_APP_TURN_CREDENTIAL }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build
          if-no-files-found: error
          retention-days: 3

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Match app version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build installers
        shell: bash
        # bundle-web copies ../build into the app (or skips it, see the script).
        run: npm run bundle-web && npx electron-builder --publish never
        env:
          # Unsigned until signing certificates are added as secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_*).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes \
              $( [[ "$TAG" == *-* ]] && echo --prerelease )
          fi

  website:
    # Optional: set the RENDER_DEPLOY_HOOK secret to redeploy the site (and its download page) after a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" && echo "Deploy triggered"; else echo "No RENDER_DEPLOY_HOOK secret; skipping"; fi
